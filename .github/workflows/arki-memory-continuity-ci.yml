name: ARKI MEMORY Continuity CI

on:
  push:
    branches: [main]
    paths:
      - "api/routes/continuity.py"
      - "api/main.py"
      - "scripts/arki_memory_backup.py"
      - "tests/test_continuity_api.py"
      - "tests/test_memory_backup.py"
      - "pyproject.toml"
      - ".github/workflows/arki-memory-continuity-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/routes/continuity.py"
      - "api/main.py"
      - "scripts/arki_memory_backup.py"
      - "tests/test_continuity_api.py"
      - "tests/test_memory_backup.py"
      - "pyproject.toml"
      - ".github/workflows/arki-memory-continuity-ci.yml"

permissions:
  contents: read

concurrency:
  group: arki-memory-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Core API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
      - name: Compile continuity runtime
        run: python -m compileall -q api src scripts/arki_memory_backup.py
      - name: Test continuity API and backup recovery
        run: pytest -q tests/test_continuity_api.py tests/test_memory_backup.py tests/test_api_v1.py
      - name: Verify patch formatting
        run: git diff --check
