name: Weekly Master Surveillance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-master-surveillance
  cancel-in-progress: false

jobs:
  surveillance:
    name: Detect master changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run VSM detector
        run: |
          python scripts/weekly_master_surveillance.py
          test -s "data/master_registry/logs/$(date -u +%F)_weekly_review.md"

      - name: Upload weekly report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-master-surveillance-${{ github.run_id }}
          path: data/master_registry/logs/*_weekly_review.md
          if-no-files-found: error
          retention-days: 90

      - name: Detect critical changes
        id: changes
        shell: bash
        run: |
          report="data/master_registry/logs/$(date -u +%F)_weekly_review.md"
          changed=$(awk -F'|' '/\| Cambios detectados \|/ {gsub(/ /, "", $3); print $3}' "$report")
          if [[ "${changed:-0}" =~ ^[1-9][0-9]*$ ]]; then
            echo "critical=true" >> "$GITHUB_OUTPUT"
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "critical=false" >> "$GITHUB_OUTPUT"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review issue for detected changes
        if: steps.changes.outputs.critical == 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_COUNT: ${{ steps.changes.outputs.changed }}
          REPORT_DATE: ${{ github.run_id }}
        with:
          script: |
            const label = 'vsm-review-required';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'VSM detected a master change requiring manual evaluation'
              });
            }
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100
            });
            if (openIssues.some(issue => issue.title.startsWith('[VSM] Master changes detected'))) {
              core.info('An open VSM review issue already exists; no duplicate created.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[VSM] Master changes detected — manual evaluation required',
              labels: [label],
              body: `## Weekly Master Surveillance\n\nThe detector found **${process.env.CHANGED_COUNT}** master(s) whose observed version differs from the registered baseline.\n\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- Artifact: \\`weekly-master-surveillance-${context.runId}\\`\n- Policy: do not update, absorb, or purge automatically. Reproduce the ground truth and classify the change under RFC-037.1.\n\nThis issue was created by detection only; no production code or rule was modified.`
            });
