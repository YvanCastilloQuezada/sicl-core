name: SICL Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    timeout-minutes: 30
    strategy:
      fail-fast: false
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test/API dependencies
        run: python -m pip install -e '.[test,api]'

      - name: Run tests
        run: python -m pytest -ra

      - name: Run schema-state verification gate
        run: python tests/verification/ci_v1_v5_schema_state_gate.py

      - name: Run atomic-migration verification gate
        run: python tests/verification/ci_atomic_migration_gate.py

      - name: Run ledger-binding benchmark gate
        run: python tests/verification/ci_ledger_binding_guard_benchmark.py

      - name: Compile source
        run: python -m compileall -q src api tests
